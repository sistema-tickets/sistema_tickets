<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle Ticket — Sistema de Tickets</title>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
<div id="app" class="app-layout" v-cloak>

  <aside class="sidebar">
    <div style="font-weight:700;font-size:1rem;padding:.5rem .75rem;margin-bottom:.5rem">Tickets</div>
    <a href="../dashboard.html" class="nav-item">Dashboard</a>
    <a href="lista.html" class="nav-item active">Mis Tickets</a>
    <a href="crear.html" class="nav-item">Nuevo Ticket</a>
    <template v-if="isAdmin">
      <hr style="border-color:var(--color-border);margin:.5rem 0">
      <a href="../admin/usuarios.html" class="nav-item">Usuarios</a>
    </template>
    <div style="flex:1"></div>
    <button @click="logout" class="btn btn-outline" style="width:100%">Cerrar sesión</button>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column">
    <div class="topbar">
      <a href="lista.html" style="color:var(--color-muted);text-decoration:none">← Volver</a>
    </div>

    <main class="main-content">
      <div v-if="loading" style="color:var(--color-muted)">Cargando...</div>

      <template v-else-if="ticket">
        <div style="display:flex;gap:1rem;align-items:flex-start;flex-wrap:wrap">

          <!-- Detalle principal -->
          <div style="flex:2;min-width:300px">
            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem">
                <div>
                  <span style="color:var(--color-muted);font-size:.875rem">#{{ ticket.id }}</span>
                  <h2 style="font-size:1.1rem;font-weight:600;margin-top:.25rem">{{ ticket.titulo }}</h2>
                </div>
                <span :class="'badge badge-'+estadoColor(ticket.estado)">{{ ticket.estado }}</span>
              </div>
              <p style="white-space:pre-wrap;color:var(--color-text);line-height:1.7">{{ ticket.descripcion }}</p>
            </div>
          </div>

          <!-- Panel lateral -->
          <div style="flex:1;min-width:220px;display:flex;flex-direction:column;gap:1rem">
            <div class="card" style="padding:1rem">
              <div style="display:flex;flex-direction:column;gap:.75rem;font-size:.875rem">
                <div><span style="color:var(--color-muted)">Estado</span><br>
                  <span :class="'badge badge-'+estadoColor(ticket.estado)">{{ ticket.estado }}</span></div>
                <div><span style="color:var(--color-muted)">Prioridad</span><br>
                  <span :class="'badge badge-'+prioridadColor(ticket.prioridad)">{{ ticket.prioridad }}</span></div>
                <div><span style="color:var(--color-muted)">Creado por</span><br>{{ ticket.creado_por_nombre }}</div>
                <div><span style="color:var(--color-muted)">Asignado a</span><br>{{ ticket.asignado_a_nombre || 'Sin asignar' }}</div>
                <div><span style="color:var(--color-muted)">Sitio</span><br>{{ ticket.sitio_nombre || '—' }}</div>
                <div><span style="color:var(--color-muted)">Fecha</span><br>{{ formatDate(ticket.created_at) }}</div>
              </div>
            </div>

            <!-- Acciones admin -->
            <div v-if="isAdmin" class="card" style="padding:1rem">
              <div class="card-title">Acciones</div>
              <div v-if="accionError" class="alert alert-error" style="font-size:.8rem">{{ accionError }}</div>
              <div class="form-group">
                <label class="form-label">Cambiar estado</label>
                <select v-model="nuevoEstado" class="form-control">
                  <option v-for="e in estados" :value="e.id">{{ e.nombre }}</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Comentario</label>
                <textarea v-model="comentario" class="form-control" rows="2" placeholder="Opcional"></textarea>
              </div>
              <button @click="actualizarEstado" class="btn btn-primary" style="width:100%" :disabled="guardando">
                {{ guardando ? 'Guardando...' : 'Actualizar estado' }}
              </button>
            </div>
          </div>

        </div>
      </template>

      <div v-else class="alert alert-error">Ticket no encontrado.</div>
    </main>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
const ESTADO_COLORES    = {1:'gray',2:'blue',3:'yellow',4:'green',5:'orange',6:'purple',7:'teal',8:'dark',9:'red'};
const PRIORIDAD_COLORES = {1:'green',2:'yellow',3:'orange',4:'red'};
const ESTADO_IDS  = {'En espera':1,'En proceso':2,'Esperando respuesta':3,'Contestado':4,'Reabierto':5,'Reprogramado':6,'Atendido':7,'Cerrado':8,'Rechazado':9};
const PRIORIDAD_IDS = {'Baja':1,'Media':2,'Alta':3,'Crítica':4};

Vue.createApp({
  data() {
    return {
      usuario: null, isAdmin: false,
      ticket: null, loading: true,
      nuevoEstado: null, comentario: '', guardando: false, accionError: '',
      estados: [
        {id:1,nombre:'En espera'},{id:2,nombre:'En proceso'},{id:3,nombre:'Esperando respuesta'},
        {id:4,nombre:'Contestado'},{id:5,nombre:'Reabierto'},{id:6,nombre:'Reprogramado'},
        {id:7,nombre:'Atendido'},{id:8,nombre:'Cerrado'},{id:9,nombre:'Rechazado'},
      ],
    };
  },
  async mounted() {
    Auth.requireAuth();
    this.usuario = Auth.getUsuario();
    this.isAdmin = Auth.isAdmin();
    const id = new URLSearchParams(location.search).get('id');
    if (!id) { this.loading = false; return; }
    const res = await api.tickets.get(id);
    this.ticket = res?.data ?? null;
    this.nuevoEstado = this.ticket ? ESTADO_IDS[this.ticket.estado] : null;
    this.loading = false;
  },
  methods: {
    async actualizarEstado() {
      this.accionError = ''; this.guardando = true;
      const res = await api.tickets.updateEstado(this.ticket.id, { estado_id: this.nuevoEstado, comentario: this.comentario });
      this.guardando = false;
      if (res?.success) {
        const res2 = await api.tickets.get(this.ticket.id);
        this.ticket = res2?.data;
        this.comentario = '';
      } else {
        this.accionError = res?.message || 'Error al actualizar';
      }
    },
    estadoColor(n)    { return ESTADO_COLORES[ESTADO_IDS[n]] ?? 'gray'; },
    prioridadColor(n) { return PRIORIDAD_COLORES[PRIORIDAD_IDS[n]] ?? 'gray'; },
    formatDate(d) { return new Date(d).toLocaleDateString('es-CO', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); },
    logout() { Auth.logout(); },
  }
}).mount('#app');
</script>
</body>
</html>
