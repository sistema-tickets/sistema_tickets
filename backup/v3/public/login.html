<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sistema de Tickets</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div id="app" class="login-page" v-cloak>
  <div class="card login-card">
    <div class="login-logo">
      <h1>Sistema de Tickets</h1>
      <p style="color:var(--color-muted);margin-top:.25rem">Ingresa tus credenciales</p>
    </div>

    <div v-if="error" class="alert alert-error">{{ error }}</div>

    <form @submit.prevent="login">
      <div class="form-group">
        <label class="form-label">Correo electrónico</label>
        <input v-model="form.email" type="email" class="form-control" placeholder="usuario@empresa.com" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input v-model="form.password" type="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%" :disabled="loading">
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="assets/js/api.js"></script>
<script>
Vue.createApp({
  data() {
    return { form: { email: '', password: '' }, error: '', loading: false };
  },
  async mounted() {
    const u = sessionStorage.getItem('usuario');
    if (u) window.location.href = 'dashboard.html';
  },
  methods: {
    async login() {
      this.error = '';
      this.loading = true;
      try {
        const res = await api.auth.login(this.form.email, this.form.password);
        if (res?.success) {
          sessionStorage.setItem('usuario', JSON.stringify(res.data));
          window.location.href = 'dashboard.html';
        } else {
          this.error = res?.message || 'Credenciales incorrectas';
        }
      } catch {
        this.error = 'Error de conexión. Intenta de nuevo.';
      } finally {
        this.loading = false;
      }
    }
  }
}).mount('#app');
</script>
</body>
</html>
