<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña — Sistema de Tickets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons/css/regular-rounded.css">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="login-body">

  <div id="app" class="login-card" style="max-width:520px" v-cloak>

    <div class="login-logo">
      <img src="../assets/img/logo.jpg" alt="Logo">
    </div>

    <!-- STEP 1: solicitar token -->
    <template v-if="!token">
      <h1 class="login-title">Restablecer contraseña</h1>
      <p class="login-sub">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>

      <div v-if="error" class="login-error">
        <span>⚠</span> {{ error }}
      </div>
      <div v-if="success" class="login-success">
        <span>✓</span> {{ success }}
      </div>

      <form v-if="!sent" @submit.prevent="requestReset" class="login-form" novalidate>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" v-model="form.email" placeholder="tucorreo@empresa.com" required autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary btn-login" :disabled="loading">
          {{ loading ? 'Enviando...' : 'Enviar enlace' }}
        </button>
        <div style="margin-top:12px;text-align:center;">
          <a href="login.html" class="btn btn-outline" style="display:inline-block;text-decoration:none;">← Volver al inicio</a>
        </div>
      </form>

      <div v-if="sent" style="margin-top:16px;text-align:center;">
        <a href="login.html" class="btn btn-outline" style="display:inline-block;text-decoration:none;">← Volver al inicio</a>
      </div>
    </template>

    <!-- STEP 2: confirmar con token -->
    <template v-else>
      <h1 class="login-title">Nueva contraseña</h1>
      <p class="login-sub">Ingresa tu nueva contraseña.</p>

      <div v-if="error" class="login-error">
        <span>⚠</span> {{ error }}
      </div>
      <div v-if="success" class="login-success">
        <span>✓</span> {{ success }}
      </div>

      <form v-if="!done" @submit.prevent="confirmReset" class="login-form" novalidate>
        <div class="form-group">
          <label for="password">Nueva contraseña</label>
          <div class="input-password-wrap">
            <input :type="showPassword ? 'text' : 'password'" id="password" v-model="form.password" placeholder="Mínimo 8 caracteres" required minlength="8" autocomplete="new-password">
            <button type="button" class="toggle-pass" @click="showPassword = !showPassword" title="Mostrar/ocultar contraseña">
              <span><i class="fi fi-rs-eye"></i></span>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="password_confirm">Confirmar contraseña</label>
          <div class="input-password-wrap">
            <input :type="showPassword ? 'text' : 'password'" id="password_confirm" v-model="form.password_confirm" placeholder="Repite la contraseña" required minlength="8" autocomplete="new-password">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-login" :disabled="loading">
          {{ loading ? 'Guardando...' : 'Restablecer contraseña' }}
        </button>
        <div style="flex:12px;text-align:center;">
          <a href="login.html" class="login-body" style="text-decoration:none;">← Volver al inicio</a>
        </div>
      </form>

      <div v-if="done" style="flex:16px;text-align:center;">
        <a href="login.html" class="login-body" style="text-decoration:none;">Ir al inicio de sesión →</a>
      </div>
    </template>

  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
  Vue.createApp({
    data() {
      const params = new URLSearchParams(window.location.search);
      return {
        token: params.get('token') || '',
        form: { email: '', password: '', password_confirm: '' },
        error: '',
        success: '',
        loading: false,
        sent: false,
        done: false,
        showPassword: false,
      };
    },
    methods: {
      async requestReset() {
        this.error = '';
        if (!this.form.email) {
          this.error = 'Ingresa tu correo electrónico.';
          return;
        }
        this.loading = true;
        try {
          const res = await api.auth.passwordReset(this.form.email);
          if (res?.success) {
            this.sent = true;
            this.success = res.message;
          } else {
            this.error = res?.message || 'Error al solicitar restablecimiento.';
          }
        } catch {
          this.error = 'Error de conexión. Intenta de nuevo.';
        } finally {
          this.loading = false;
        }
      },
      async confirmReset() {
        this.error = '';
        if (!this.form.password || !this.form.password_confirm) {
          this.error = 'Por favor completa todos los campos.';
          return;
        }
        if (this.form.password !== this.form.password_confirm) {
          this.error = 'Las contraseñas no coinciden.';
          return;
        }
        this.loading = true;
        try {
          const res = await api.auth.passwordResetConfirm(this.token, this.form.password);
          if (res?.success) {
            this.done = true;
            this.success = 'Contraseña restablecida exitosamente.';
          } else {
            this.error = res?.message || 'Error al restablecer la contraseña.';
          }
        } catch {
          this.error = 'Error de conexión. Intenta de nuevo.';
        } finally {
          this.loading = false;
        }
      }
    }
  }).mount('#app');
  </script>
</body>
</html>
